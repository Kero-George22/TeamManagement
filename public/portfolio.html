<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Portfolio — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.02)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.02)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0;}

    .port-hero {
      background:var(--bg-card);border:1px solid var(--border);padding:36px;
      margin-bottom:24px;position:relative;overflow:hidden;animation:fade-up 0.4s ease;
    }
    .port-hero::before { content:'PORTFOLIO';position:absolute;right:24px;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-size:80px;font-weight:900;letter-spacing:12px;color:rgba(0,229,255,0.03);pointer-events:none; }
    .port-hero::after { content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--gold)); }
    .ph-inner { display:flex;align-items:center;gap:32px;flex-wrap:wrap; }
    .ph-avatar { width:80px;height:80px;font-size:44px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:var(--cyan-dim);flex-shrink:0; }
    .ph-info { flex:1; }
    .ph-name { font-family:var(--font-display);font-size:28px;font-weight:900;letter-spacing:4px;color:var(--text-1); }
    .ph-title { font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:4px;margin-top:4px; }
    .ph-bio { font-size:13px;color:var(--text-2);line-height:1.7;margin-top:8px;max-width:420px; }
    .ph-actions { display:flex;gap:10px;flex-wrap:wrap; }

    /* PDF-style layout for items */
    .port-section-title { font-family:var(--font-display);font-size:11px;letter-spacing:4px;color:var(--text-2);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:16px; }

    .proj-port-card {
      border:1px solid var(--border);padding:20px;margin-bottom:14px;
      background:var(--bg-card-hi);transition:border-color 0.2s;
    }
    .proj-port-card:hover { border-color:var(--border-hi); }
    .ppc-header { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px; }
    .ppc-name { font-family:var(--font-display);font-size:15px;letter-spacing:2px;color:var(--text-1); }
    .ppc-role { font-family:var(--font-mono);font-size:10px;padding:3px 10px;background:var(--cyan-dim);color:var(--cyan); }
    .ppc-desc { font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:12px; }
    .ppc-tech { display:flex;flex-wrap:wrap;gap:6px; }
    .ppc-tech-tag { font-family:var(--font-mono);font-size:10px;padding:2px 8px;border:1px solid var(--border-hi);color:var(--text-2); }
    .ppc-stats { display:flex;gap:24px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border); }
    .ppc-stat { font-family:var(--font-mono);font-size:11px;color:var(--text-2); }
    .ppc-stat span { color:var(--gold);font-weight:700; }

    .skill-grid-port { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px; }
    .skill-port-card { background:var(--bg-card-hi);border:1px solid var(--border);padding:16px; }
    .spc-area { font-family:var(--font-display);font-size:11px;letter-spacing:3px;margin-bottom:8px; }
    .spc-level { font-family:var(--font-mono);font-size:10px;padding:2px 8px;display:inline-block;margin-bottom:10px; }
    .level-Expert { background:rgba(255,215,0,0.1);color:var(--gold);border:1px solid var(--gold); }
    .level-Advanced { background:var(--cyan-dim);color:var(--cyan);border:1px solid var(--cyan); }
    .level-Intermediate { background:rgba(155,109,255,0.1);color:var(--purple);border:1px solid var(--purple); }
    .level-Beginner { background:rgba(255,50,50,0.08);color:var(--red);border:1px solid var(--red); }

    .badge-shelf { display:flex;flex-wrap:wrap;gap:12px; }
    .badge-item { display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;border:1px solid var(--border);background:var(--bg-card-hi);min-width:90px;text-align:center; }
    .badge-item .bi-icon { font-size:28px; }
    .badge-item .bi-name { font-family:var(--font-display);font-size:9px;letter-spacing:2px;color:var(--text-2); }

    .share-bar { display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--border);padding:14px 20px;margin-top:24px;flex-wrap:wrap; }
    .share-url { font-family:var(--font-mono);font-size:11px;color:var(--cyan);flex:1;word-break:break-all; }
    .copy-done { color:var(--green)!important; }

    .export-row { display:flex;gap:10px;flex-wrap:wrap;margin-top:6px; }
  </style>
</head>
<body class="grid-bg">
<div class="app-layout">
  <main class="app-main" id="main" style="opacity:0;">

    <!-- Hero -->
    <div class="port-hero" id="port-hero">
      <div class="loader"><div class="spinner"></div></div>
    </div>

    <!-- Stats -->
    <div class="grid-4 mb-6">
      <div class="stat-card"><span class="sc-icon">🏗</span><div class="sc-val" id="ps-projects">—</div><div class="sc-lbl">Projects</div></div>
      <div class="stat-card gld"><span class="sc-icon">⚔️</span><div class="sc-val" id="ps-tasks">—</div><div class="sc-lbl">Tasks Completed</div></div>
      <div class="stat-card ppl"><span class="sc-icon">🧠</span><div class="sc-val" id="ps-skills">—</div><div class="sc-lbl">Skills Assessed</div></div>
      <div class="stat-card grn"><span class="sc-icon">⭐</span><div class="sc-val" id="ps-xp">—</div><div class="sc-lbl">Total XP</div></div>
    </div>

    <!-- Projects section -->
    <div class="card mb-6">
      <div class="port-section-title">PROJECTS</div>
      <div id="port-projects"><div class="loader"><div class="spinner"></div></div></div>
    </div>

    <!-- Skills + Badges row -->
    <div class="grid-2 mb-6">
      <div class="card">
        <div class="port-section-title">SKILL ASSESSMENTS</div>
        <div class="skill-grid-port" id="port-skills"></div>
      </div>
      <div class="card">
        <div class="port-section-title">EARNED BADGES</div>
        <div class="badge-shelf" id="port-badges"></div>
        <div id="port-badges-empty" style="display:none;" class="empty-state">
          <div class="es-icon">🏅</div>
          <div class="es-text">No badges yet</div>
          <div class="es-sub">Complete projects and assessments to earn badges</div>
        </div>
      </div>
    </div>

    <!-- Export + Share -->
    <div class="card">
      <div class="port-section-title">EXPORT & SHARE</div>
      <div class="export-row">
        <button class="btn btn-outline" id="export-json">↓ JSON</button>
        <button class="btn btn-outline" id="export-md">↓ Markdown</button>
        <button class="btn btn-outline" id="export-csv">↓ CSV</button>
      </div>
      <div class="share-bar" style="margin-top:16px;">
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-2);letter-spacing:3px;">PUBLIC LINK:</span>
        <span class="share-url" id="share-url">—</span>
        <button class="btn btn-sm btn-cyan" id="copy-link">📋 Copy</button>
      </div>
    </div>

  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
if (!Auth.require()) {}
else {
  injectNav('Portfolio');
  const me = Auth.user();

  async function load() {
    try {
      const [portData, statsData] = await Promise.all([
        API.get('/portfolio/me'),
        API.get('/portfolio/me/stats').catch(() => null),
      ]);
      renderHero(portData);
      renderStats(portData, statsData);
      renderProjects(portData.projects || []);
      renderSkills(portData.skills || portData.skillAssessments || {});
      renderBadges(portData.badges || portData.earnedBadges || []);
      document.getElementById('share-url').textContent = `${location.origin}/portfolio/public/${me._id}`;
      document.getElementById('main').style.opacity = '1';
      document.getElementById('main').style.animation = 'fade-up 0.4s ease';
    } catch (err) {
      document.getElementById('port-hero').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      document.getElementById('main').style.opacity = '1';
    }
  }

  function renderHero(p) {
    const u = p.user || me;
    document.getElementById('port-hero').innerHTML = `
      <div class="ph-inner">
        <div class="ph-avatar">${u.avatar || '👤'}</div>
        <div class="ph-info">
          <div class="ph-name">${u.username || u.email?.split('@')[0] || 'HERO'}</div>
          <div class="ph-title">${u.title || 'FULL-STACK WARRIOR · LEVEL ' + (u.level || 1)}</div>
          <div class="ph-bio">${u.bio || 'Conquering code challenges across the digital arena.'}</div>
        </div>
        <div class="ph-actions">
          <a href="/profile.html" class="btn btn-sm btn-outline">Edit Profile</a>
          <a href="/leaderboard.html" class="btn btn-sm btn-cyan">Leaderboard →</a>
        </div>
      </div>`;
  }

  function renderStats(p, stats) {
    const s = stats || p;
    document.getElementById('ps-projects').textContent = s.totalProjects || s.projectCount || (p.projects||[]).length || 0;
    document.getElementById('ps-tasks').textContent = s.completedTasks || s.taskCount || 0;
    const skillMap = p.skills || p.skillAssessments || {};
    document.getElementById('ps-skills').textContent = Object.values(skillMap).filter(v => v && v.level).length;
    document.getElementById('ps-xp').textContent = (s.totalXP || s.xp || 0).toLocaleString();
  }

  function renderProjects(projects) {
    const el = document.getElementById('port-projects');
    if (!projects.length) {
      el.innerHTML = '<div class="empty-state"><div class="es-icon">🏗</div><div class="es-text">No projects in portfolio yet.</div><div class="es-sub">Join a project and complete tasks to add it here.</div></div>';
      return;
    }
    el.innerHTML = projects.map(p => {
      const tech = (p.techStack || p.technologies || []).slice(0, 6);
      return `<div class="proj-port-card" onclick="window.location='/project.html?id=${p.projectId||p._id||''}'">
        <div class="ppc-header">
          <div class="ppc-name">${p.projectName || p.name || 'Unnamed Project'}</div>
          ${p.role ? `<span class="ppc-role">${p.role}</span>` : ''}
        </div>
        <div class="ppc-desc">${p.description || p.summary || 'No description.'}</div>
        ${tech.length ? `<div class="ppc-tech">${tech.map(t => `<span class="ppc-tech-tag">${t}</span>`).join('')}</div>` : ''}
        <div class="ppc-stats">
          <div class="ppc-stat">Tasks Completed: <span>${p.tasksCompleted || 0}</span></div>
          <div class="ppc-stat">XP Earned: <span>${p.xpEarned || 0}</span></div>
          ${p.avgScore ? `<div class="ppc-stat">Avg Score: <span>${p.avgScore}/100</span></div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  function renderSkills(skills) {
    const areas = ['Frontend','Backend','FullStack','DevOps','DataScience'];
    const icons = { Frontend:'⚡', Backend:'🔧', FullStack:'🌐', DevOps:'🚀', DataScience:'🧠' };
    const el = document.getElementById('port-skills');
    const assessed = areas.filter(a => skills[a] && skills[a].level);
    if (!assessed.length) {
      el.innerHTML = '<div class="empty-state"><div class="es-icon">🧪</div><div class="es-text">No assessments taken.</div><a href="/assessment.html" class="btn btn-sm btn-cyan" style="margin-top:12px;">Take an Assessment</a></div>';
      return;
    }
    el.innerHTML = assessed.map(a => {
      const s = skills[a];
      return `<div class="skill-port-card">
        <div class="spc-area">${icons[a]} ${a}</div>
        <span class="spc-level level-${s.level}">${s.level}</span>
        <div class="xp-track">
          <div class="xp-fill" style="--w:${scoreToPercent(s.level)}%;animation:xp-in 1.2s ease both;"></div>
        </div>
        ${s.score ? `<div style="font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:6px;">Score: ${s.score}/100</div>` : ''}
      </div>`;
    }).join('');
  }

  function scoreToPercent(level) {
    return { Expert:100, Advanced:75, Intermediate:50, Beginner:25 }[level] || 0;
  }

  function renderBadges(badges) {
    const el = document.getElementById('port-badges');
    const emptyEl = document.getElementById('port-badges-empty');
    if (!badges.length) { el.style.display = 'none'; emptyEl.style.display = 'block'; return; }
    const icons = { 'first-task':'🎯','first-project':'🏗','level-up':'⬆️','perfect-score':'💯','speed-runner':'⚡','reliable':'🛡','top-10':'🏆' };
    el.innerHTML = badges.map(b => {
      const name = typeof b === 'string' ? b : b.name || b;
      const icon = icons[name] || '🏅';
      return `<div class="badge-item"><div class="bi-icon">${icon}</div><div class="bi-name">${name}</div></div>`;
    }).join('');
  }

  // ─── Exports ───
  function triggerDownload(url) {
    const a = document.createElement('a'); a.href = url; a.click();
  }
  async function downloadExport(format) {
    try {
      const token = Auth.token();
      const url = `/portfolio/export/${format}`;
      const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) { const e = await res.json(); throw new Error(e.message || 'Export failed'); }
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = `portfolio-${me._id || 'export'}.${format}`;
      a.click();
      URL.revokeObjectURL(objUrl);
    } catch (err) {
      Toast.error(err.message);
    }
  }
  document.getElementById('export-json').addEventListener('click', () => downloadExport('json'));
  document.getElementById('export-md').addEventListener('click',   () => downloadExport('markdown'));
  document.getElementById('export-csv').addEventListener('click',  () => downloadExport('csv'));

  // Copy public link
  document.getElementById('copy-link').addEventListener('click', () => {
    const url = document.getElementById('share-url').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copy-link');
      btn.textContent = '✓ Copied!'; btn.classList.add('btn-outline');
      setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('btn-outline'); }, 2000);
    });
  });

  load();
}
</script>
</body>
</html>
