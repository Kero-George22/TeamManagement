<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forgot Password — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before { content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0; }
    body { display:flex;align-items:center;justify-content:center;min-height:100vh; }
  </style>
</head>
<body class="grid-bg">
<div class="portal">
  <div class="portal-box">
    <div class="portal-logo">
      <div class="portal-logo-hex">XP</div>
      <span class="portal-brand">JOB<b>XP</b></span>
    </div>
    <h1 class="portal-title">RECOVER ACCOUNT</h1>
    <p class="portal-sub">Enter your email to receive a reset link</p>

    <div id="alert-area"></div>

    <form id="fp-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="hero@jobxp.io" required/>
      </div>
      <button type="submit" class="btn btn-cyan btn-lg" id="submit-btn" style="width:100%;justify-content:center;">
        ✉ SEND RESET LINK
      </button>
    </form>

    <div class="portal-footer">
      <a href="/login.html">← Back to login</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  const form  = document.getElementById('fp-form');
  const btn   = document.getElementById('submit-btn');
  const alert = document.getElementById('alert-area');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'SENDING…'; alert.innerHTML = '';
    try {
      await API.post('/auth/forgot-password', { email: document.getElementById('email').value.trim() });
      alert.innerHTML = `<div class="alert alert-success">Reset link sent! Check your inbox & spam folder.</div>`;
      btn.textContent = '✓ EMAIL SENT';
    } catch (err) {
      alert.innerHTML = `<div class="alert alert-error">${err.message || 'Failed to send email.'}</div>`;
      btn.disabled = false; btn.textContent = '✉ SEND RESET LINK';
    }
  });
</script>
</body>
</html>
