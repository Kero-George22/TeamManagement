<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Virtual Office — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.02)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.02)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0;}

    /* Office layout */
    .office-layout { display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 64px);overflow:hidden;gap:0; }
    @media(max-width:768px) { .office-layout { grid-template-columns:1fr;grid-template-rows:auto 1fr; } }

    /* Sidebar */
    .office-sidebar {
      background:var(--bg-card);border-right:1px solid var(--border);
      display:flex;flex-direction:column;overflow:hidden;
    }
    .sidebar-header { padding:20px;border-bottom:1px solid var(--border);flex-shrink:0; }
    .sidebar-title { font-family:var(--font-display);font-size:11px;letter-spacing:4px;color:var(--text-2); }
    .sidebar-search { position:relative;margin-top:10px; }
    .sidebar-search input { width:100%;background:var(--bg-base);border:1px solid var(--border);padding:8px 12px 8px 32px;font-family:var(--font-mono);font-size:11px;color:var(--text-1);outline:none; }
    .sidebar-search input:focus { border-color:var(--border-hi); }
    .sidebar-search::before { content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none; }
    .project-list { flex:1;overflow-y:auto; }
    .project-list::-webkit-scrollbar { width:4px; }
    .project-list::-webkit-scrollbar-track { background:transparent; }
    .project-list::-webkit-scrollbar-thumb { background:var(--border-hi);border-radius:2px; }
    .proj-item {
      padding:14px 20px;cursor:pointer;border-bottom:1px solid var(--border);
      transition:background 0.15s;display:flex;align-items:center;gap:12px;
    }
    .proj-item:hover { background:var(--bg-card-hi); }
    .proj-item.active { background:rgba(0,229,255,0.07);border-left:3px solid var(--cyan); }
    .proj-item-av { width:36px;height:36px;border-radius:4px;background:var(--cyan-dim);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0; }
    .proj-item-name { font-family:var(--font-display);font-size:11px;letter-spacing:2px;color:var(--text-1); }
    .proj-item-sub { font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:2px; }
    .proj-unread { margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--cyan);color:#000;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0; }

    /* Chat pane */
    .chat-pane { display:flex;flex-direction:column;height:100%;overflow:hidden; }
    .chat-header {
      padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
      background:var(--bg-card);flex-shrink:0;
    }
    .chat-proj-name { font-family:var(--font-display);font-size:14px;letter-spacing:3px;color:var(--text-1); }
    .ai-status { display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--text-2);margin-left:auto; }
    .ai-dot { width:8px;height:8px;border-radius:50%;background:var(--red); }
    .ai-dot.online { background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.5;} }

    .chat-messages {
      flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;
    }
    .chat-messages::-webkit-scrollbar { width:4px; }
    .chat-messages::-webkit-scrollbar-track { background:transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background:var(--border-hi);border-radius:2px; }

    .msg { display:flex;gap:10px;max-width:72%;animation:fade-up 0.2s ease; }
    .msg.mine { flex-direction:row-reverse;align-self:flex-end; }
    .msg.ai { max-width:80%; }
    .msg-av { width:34px;height:34px;font-size:18px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:var(--cyan-dim);flex-shrink:0;align-self:flex-end; }
    .msg.mine .msg-av { background:rgba(155,109,255,0.15); }
    .msg.ai .msg-av { background:rgba(57,255,20,0.1); }
    .msg-body { display:flex;flex-direction:column;gap:4px; }
    .msg.mine .msg-body { align-items:flex-end; }
    .msg-sender { font-family:var(--font-display);font-size:9px;letter-spacing:2px;color:var(--text-2); }
    .msg-bubble {
      padding:10px 16px;font-size:13px;line-height:1.6;color:var(--text-1);
      background:var(--bg-card-hi);border:1px solid var(--border);max-width:100%;word-break:break-word;
    }
    .msg.mine .msg-bubble { background:rgba(155,109,255,0.12);border-color:rgba(155,109,255,0.3); }
    .msg.ai .msg-bubble { background:rgba(57,255,20,0.06);border-color:rgba(57,255,20,0.2);border-left:3px solid var(--green); }
    .msg-time { font-family:var(--font-mono);font-size:9px;color:var(--text-3); }

    .typing-indicator { display:flex;gap:4px;align-items:center;padding:10px 16px; }
    .typing-dot { width:6px;height:6px;border-radius:50%;background:var(--green);animation:type-bounce 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay:0.2s; }
    .typing-dot:nth-child(3) { animation-delay:0.4s; }
    @keyframes type-bounce { 0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);} }

    .chat-input-row {
      padding:14px 24px;border-top:1px solid var(--border);background:var(--bg-card);
      display:flex;gap:10px;align-items:flex-end;flex-shrink:0;
    }
    .chat-textarea {
      flex:1;background:var(--bg-base);border:1px solid var(--border);
      padding:10px 14px;font-family:var(--font-mono);font-size:12px;color:var(--text-1);resize:none;
      min-height:40px;max-height:120px;outline:none;
    }
    .chat-textarea:focus { border-color:var(--border-hi); }
    .send-btn { flex-shrink:0; }

    .no-project { flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px; }
    .no-project-icon { font-size:60px;opacity:0.3; }
    .no-project-text { font-family:var(--font-display);font-size:13px;letter-spacing:4px;color:var(--text-2); }

    .date-divider { text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-3);letter-spacing:3px;padding:4px 0;margin:4px 0; }
  </style>
</head>
<body class="grid-bg">
<div class="app-layout">
  <div class="office-layout">
    <!-- Sidebar: project list -->
    <aside class="office-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">VIRTUAL OFFICE</div>
        <div class="sidebar-search"><input type="text" id="proj-search" placeholder="Search projects…"/></div>
      </div>
      <div class="project-list" id="proj-list">
        <div style="padding:20px;text-align:center;"><div class="spinner"></div></div>
      </div>
    </aside>

    <!-- Chat pane -->
    <div class="chat-pane" id="chat-pane">
      <div class="no-project" id="no-project">
        <div class="no-project-icon">🏢</div>
        <div class="no-project-text">SELECT A PROJECT TO ENTER</div>
      </div>

      <!-- Active chat (hidden until project selected) -->
      <div id="active-chat" style="display:none;flex:1;flex-direction:column;overflow:hidden;display:none;">
        <div class="chat-header">
          <div>
            <div class="chat-proj-name" id="chat-proj-name">—</div>
            <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-3);" id="chat-member-count"></div>
          </div>
          <div class="ai-status">
            <div class="ai-dot" id="ai-dot"></div>
            <span id="ai-status-text">AI Manager offline</span>
          </div>
          <a id="proj-link" href="#" class="btn btn-sm btn-ghost" style="margin-left:12px;">View Project →</a>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-row">
          <textarea class="chat-textarea" id="msg-input" placeholder="Send a message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
          <button class="btn btn-cyan send-btn" id="send-btn">⚡ Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
if (!Auth.require()) {}
else {
  injectNav('Office');
  const me = Auth.user();
  let projects = [];
  let currentProjectId = null;
  let pollInterval = null;
  let lastMsgId = null;

  // Load user's projects
  async function loadProjects() {
    try {
      const data = await API.get('/projects?limit=50');
      projects = data.projects || data;
      renderProjectList(projects);
      // Check for ?id= URL param
      const autoId = qp('id');
      if (autoId) selectProject(autoId);
    } catch (err) {
      document.getElementById('proj-list').innerHTML = `<div style="padding:20px;"><div class="alert alert-error">${err.message}</div></div>`;
    }
  }

  function renderProjectList(list) {
    const el = document.getElementById('proj-list');
    if (!list.length) {
      el.innerHTML = '<div style="padding:20px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-3);">No projects joined yet.</div>';
      return;
    }
    el.innerHTML = list.map(p => {
      const statusColors = { active:'var(--green)', paused:'var(--gold)', completed:'var(--cyan)', cancelled:'var(--red)' };
      const col = statusColors[p.status] || 'var(--text-2)';
      return `<div class="proj-item${p._id === currentProjectId ? ' active' : ''}" data-id="${p._id}">
        <div class="proj-item-av">🏢</div>
        <div>
          <div class="proj-item-name">${p.name || 'Unnamed'}</div>
          <div class="proj-item-sub" style="color:${col};">⬤ ${p.status || 'unknown'}</div>
        </div>
      </div>`;
    }).join('');
    el.querySelectorAll('.proj-item').forEach(item => {
      item.addEventListener('click', () => selectProject(item.dataset.id));
    });
  }

  // Search filter
  document.getElementById('proj-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderProjectList(projects.filter(p => (p.name||'').toLowerCase().includes(q)));
  });

  // Select project
  async function selectProject(id) {
    currentProjectId = id;
    clearInterval(pollInterval);
    lastMsgId = null;

    // Update sidebar active state
    renderProjectList(projects.filter(p => p.name !== undefined || p._id === id ? true : false));
    document.querySelectorAll('.proj-item').forEach(item => {
      item.classList.toggle('active', item.dataset.id === id);
    });

    const proj = projects.find(p => p._id === id) || { name: id };
    document.getElementById('chat-proj-name').textContent = proj.name || id;
    document.getElementById('proj-link').href = `/project.html?id=${id}`;
    document.getElementById('no-project').style.display = 'none';
    const activeChat = document.getElementById('active-chat');
    activeChat.style.display = 'flex';
    document.getElementById('chat-messages').innerHTML = '<div style="text-align:center;padding:30px;"><div class="spinner"></div></div>';

    await loadMessages(true);
    await loadAIStatus();
    pollInterval = setInterval(() => { loadMessages(false); loadAIStatus(); }, 5000);
  }

  async function loadMessages(initial) {
    if (!currentProjectId) return;
    try {
      const data = await API.get(`/office/${currentProjectId}/messages`);
      const msgs = data.messages || data;
      renderMessages(msgs, initial);
    } catch (err) {
      if (initial) document.getElementById('chat-messages').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }

  function renderMessages(msgs, scrollToBottom = true) {
    const el = document.getElementById('chat-messages');
    if (!msgs.length) {
      el.innerHTML = '<div class="empty-state"><div class="es-icon">💬</div><div class="es-text">No messages yet.</div><div class="es-sub">Be the first to speak up in this office!</div></div>';
      return;
    }
    let html = '';
    let lastDate = null;
    msgs.forEach(m => {
      const d = new Date(m.createdAt || m.timestamp || Date.now());
      const dateStr = d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
      if (dateStr !== lastDate) {
        html += `<div class="date-divider">── ${dateStr} ──</div>`;
        lastDate = dateStr;
      }
      const isAI = m.sender === 'ai' || m.isAI || m.senderType === 'ai';
      const isMe = m.senderId === me?._id || m.sender?._id === me?._id || m.sender === me?._id;
      const senderName = isAI ? '🤖 AI MANAGER' : (m.senderName || m.sender?.username || 'HERO');
      const avatar = isAI ? '🤖' : (m.sender?.avatar || m.senderAvatar || '👤');
      const timeStr = d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
      html += `<div class="msg${isMe ? ' mine' : ''}${isAI ? ' ai' : ''}">
        <div class="msg-av">${avatar}</div>
        <div class="msg-body">
          <div class="msg-sender">${senderName}</div>
          <div class="msg-bubble">${escHtml(m.content || m.text || m.message || '')}</div>
          <div class="msg-time">${timeStr}</div>
        </div>
      </div>`;
    });
    el.innerHTML = html;
    if (scrollToBottom) el.scrollTop = el.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function loadAIStatus() {
    if (!currentProjectId) return;
    try {
      const data = await API.get(`/office/${currentProjectId}/status`);
      const online = data.online || data.isOnline || data.status === 'online';
      const dot = document.getElementById('ai-dot');
      const txt = document.getElementById('ai-status-text');
      dot.className = 'ai-dot' + (online ? ' online' : '');
      txt.textContent = online ? 'AI Manager online' : 'AI Manager offline';
    } catch {}
  }

  // Send message
  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const content = input.value.trim();
    if (!content || !currentProjectId) return;
    const btn = document.getElementById('send-btn');
    btn.disabled = true; input.disabled = true;

    // Optimistic render
    const messages = document.getElementById('chat-messages');
    const tempId = 'temp-' + Date.now();
    const timeStr = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
    const tempHtml = `<div class="msg mine" id="${tempId}">
      <div class="msg-av">${me?.avatar || '👤'}</div>
      <div class="msg-body" style="align-items:flex-end;">
        <div class="msg-sender">${me?.username || 'YOU'}</div>
        <div class="msg-bubble">${escHtml(content)}</div>
        <div class="msg-time">${timeStr} · sending…</div>
      </div>
    </div>`;
    messages.insertAdjacentHTML('beforeend', tempHtml);
    messages.scrollTop = messages.scrollHeight;
    input.value = '';

    // Show AI typing indicator
    const typingHtml = `<div class="msg ai" id="ai-typing">
      <div class="msg-av">🤖</div>
      <div class="msg-body">
        <div class="msg-sender">🤖 AI MANAGER</div>
        <div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>
      </div>
    </div>`;
    messages.insertAdjacentHTML('beforeend', typingHtml);
    messages.scrollTop = messages.scrollHeight;

    try {
      await API.post(`/office/${currentProjectId}/messages`, { content });
      // Remove optimistic + typing, reload all
      const temp = document.getElementById(tempId);
      const typing = document.getElementById('ai-typing');
      if (temp) temp.remove();
      if (typing) typing.remove();
      await loadMessages(false);
      messages.scrollTop = messages.scrollHeight;
    } catch (err) {
      const temp = document.getElementById(tempId);
      const typing = document.getElementById('ai-typing');
      if (temp) temp.remove();
      if (typing) typing.remove();
      Toast.error(err.message);
    } finally {
      btn.disabled = false; input.disabled = false; input.focus();
    }
  }

  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Auto-resize textarea
  document.getElementById('msg-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  loadProjects();
}
</script>
</body>
</html>
