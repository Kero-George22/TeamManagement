<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Verify Email — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before { content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0; }
    body { display:flex;align-items:center;justify-content:center;min-height:100vh; }
    .verify-icon { font-size:64px; text-align:center; margin-bottom:24px; animation:float 3s ease-in-out infinite; }
  </style>
</head>
<body class="grid-bg">
<div class="portal">
  <div class="portal-box">
    <div class="portal-logo">
      <div class="portal-logo-hex">XP</div>
      <span class="portal-brand">JOB<b>XP</b></span>
    </div>
    <div class="verify-icon">📬</div>
    <h1 class="portal-title">CHECK YOUR EMAIL</h1>
    <p class="portal-sub" id="sub-text">We sent a verification code to your email address.</p>

    <div id="alert-area" style="margin-bottom:16px;"></div>

    <form id="verify-form">
      <div class="form-group">
        <label class="form-label">Verification Token</label>
        <input type="text" id="token" class="form-input" placeholder="Paste your token here" required/>
        <div class="form-hint">Check your inbox (and spam folder)</div>
      </div>
      <button type="submit" class="btn btn-cyan btn-lg" id="submit-btn" style="width:100%;justify-content:center;">
        ✓ VERIFY & ACTIVATE
      </button>
    </form>

    <div class="portal-footer">
      <a href="/login.html">← Back to login</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  const email = qp('email');
  if (email) {
    document.getElementById('sub-text').textContent =
      'We sent a verification code to ' + email;
  }

  const form  = document.getElementById('verify-form');
  const btn   = document.getElementById('submit-btn');
  const alert = document.getElementById('alert-area');

  function showAlert(msg, type = 'error') {
    alert.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'VERIFYING…';
    alert.innerHTML = '';
    try {
      await API.post('/auth/verify', { token: document.getElementById('token').value.trim() });
      showAlert('Account verified! Redirecting to login…', 'success');
      setTimeout(() => window.location.href = '/login.html', 1800);
    } catch (err) {
      showAlert(err.message || 'Invalid or expired token.');
      btn.disabled = false;
      btn.textContent = '✓ VERIFY & ACTIVATE';
    }
  });
</script>
</body>
</html>
