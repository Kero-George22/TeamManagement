<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset Password — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before { content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0; }
    body { display:flex;align-items:center;justify-content:center;min-height:100vh; }
  </style>
</head>
<body class="grid-bg">
<div class="portal">
  <div class="portal-box">
    <div class="portal-logo">
      <div class="portal-logo-hex">XP</div>
      <span class="portal-brand">JOB<b>XP</b></span>
    </div>
    <h1 class="portal-title">RESET PASSWORD</h1>
    <p class="portal-sub">Enter your reset token and new password</p>

    <div id="alert-area"></div>

    <form id="rp-form">
      <div class="form-group">
        <label class="form-label">Reset Token</label>
        <input type="text" id="token" class="form-input" placeholder="Token from your email" required/>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min 8 characters" required minlength="8"/>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" id="confirm" class="form-input" placeholder="Repeat password" required/>
        <div class="form-error" id="match-err">Passwords do not match</div>
      </div>
      <button type="submit" class="btn btn-cyan btn-lg" id="submit-btn" style="width:100%;justify-content:center;">
        🔒 RESET PASSWORD
      </button>
    </form>

    <div class="portal-footer">
      <a href="/login.html">← Back to login</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  /* Pre-fill token from URL if present */
  const tokenParam = qp('token');
  if (tokenParam) document.getElementById('token').value = tokenParam;

  const form      = document.getElementById('rp-form');
  const btn       = document.getElementById('submit-btn');
  const alertArea = document.getElementById('alert-area');
  const matchErr  = document.getElementById('match-err');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    matchErr.classList.remove('show');
    const pw = document.getElementById('password').value;
    const cf = document.getElementById('confirm').value;
    if (pw !== cf) { matchErr.classList.add('show'); return; }

    btn.disabled = true; btn.textContent = 'RESETTING…'; alertArea.innerHTML = '';
    try {
      await API.post('/auth/reset-password', {
        token: document.getElementById('token').value.trim(),
        newPassword: pw,
      });
      alertArea.innerHTML = `<div class="alert alert-success">Password reset! Redirecting to login…</div>`;
      setTimeout(() => window.location.href = '/login.html', 1800);
    } catch (err) {
      alertArea.innerHTML = `<div class="alert alert-error">${err.message || 'Reset failed.'}</div>`;
      btn.disabled = false; btn.textContent = '🔒 RESET PASSWORD';
    }
  });
</script>
</body>
</html>
