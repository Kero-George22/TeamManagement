<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before {
      content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0;
    }
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .glow-orb { position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(ellipse,rgba(0,229,255,0.04)0%,transparent 65%);pointer-events:none;z-index:0; }
  </style>
</head>
<body class="grid-bg">
<div class="glow-orb"></div>
<div class="portal">
  <div class="portal-box">
    <div class="portal-logo">
      <div class="portal-logo-hex">XP</div>
      <span class="portal-brand">JOB<b>XP</b></span>
    </div>
    <h1 class="portal-title">WELCOME BACK</h1>
    <p class="portal-sub">Log in to continue your quest</p>

    <div id="alert-area"></div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="hero@jobxp.io" required/>
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;justify-content:space-between;">
          Password
          <a href="/forgot-password.html" style="color:var(--cyan);font-size:10px;font-family:var(--font-mono);">FORGOT?</a>
        </label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-cyan btn-lg" id="submit-btn" style="width:100%;justify-content:center;">
        ⚔ ENTER THE ARENA
      </button>
    </form>

    <div class="portal-footer">
      No account? <a href="/register.html">Create one →</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  Auth.redirectIfLoggedIn();

  const form  = document.getElementById('login-form');
  const btn   = document.getElementById('submit-btn');
  const alert = document.getElementById('alert-area');

  function showAlert(msg, type = 'error') {
    alert.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'CONNECTING…';
    alert.innerHTML = '';
    try {
      const data = await API.post('/auth/login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      Auth.save(data.token, data.user);
      window.location.href = '/dashboard.html';
    } catch (err) {
      showAlert(err.message || 'Login failed. Check your credentials.');
      btn.disabled = false;
      btn.textContent = '⚔ ENTER THE ARENA';
    }
  });
</script>
</body>
</html>
