<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Projects — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before { content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.02)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.02)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0; }
  </style>
</head>
<body class="grid-bg">
<div class="app-layout">
  <main class="app-main">

    <div class="page-header">
      <span class="page-tag">Arena</span>
      <h1 class="page-title">ACTIVE <span class="hi">PROJECTS</span></h1>
      <p class="page-desc">Join a project, claim tasks, earn XP.</p>
    </div>

    <!-- Search + filter -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <input type="text" id="search" class="search-input" placeholder="Search projects…"/>
      </div>
      <select id="status-filter" class="form-select" style="width:auto;padding:10px 14px;">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
        <option value="paused">Paused</option>
      </select>
      <div id="admin-create-wrap" class="hidden">
        <button class="btn btn-cyan" id="create-btn">+ NEW PROJECT</button>
      </div>
    </div>

    <div id="projects-grid" class="grid-auto">
      <div class="loader"><div class="spinner"></div></div>
    </div>

    <div id="pagination" class="pagination"></div>
  </main>
</div>

<!-- Create Project Modal (admin only) -->
<div class="modal-overlay" id="create-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">NEW PROJECT</span>
      <button class="modal-close" data-modal-close="create-modal">✕</button>
    </div>
    <form id="create-form">
      <div class="form-group">
        <label class="form-label">Project Name</label>
        <input type="text" id="p-name" class="form-input" placeholder="e.g. E-Commerce Platform" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="p-desc" class="form-textarea" placeholder="What will the team build?" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Tech Stack</label>
        <input type="text" id="p-tech" class="form-input" placeholder="React, Node.js, MongoDB…"/>
      </div>
      <div class="form-group">
        <label class="form-label">Roles Needed (comma-separated)</label>
        <input type="text" id="p-roles" class="form-input" placeholder="Frontend, Backend, DevOps"/>
      </div>
      <div class="form-group">
        <label class="form-label">Max Members</label>
        <input type="number" id="p-max" class="form-input" placeholder="10" min="1" max="50"/>
      </div>
      <div id="create-alert"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close="create-modal">Cancel</button>
        <button type="submit" class="btn btn-cyan" id="create-submit">CREATE PROJECT</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
if (!Auth.require()) {}
else {
  injectNav('Projects');
  const user = Auth.user();
  if (user && user.isAdmin) {
    document.getElementById('admin-create-wrap').classList.remove('hidden');
    document.getElementById('create-btn').addEventListener('click', () => openModal('create-modal'));
  }

  let page = 1, total = 0;
  const limit = 12;

  async function loadProjects() {
    const search = document.getElementById('search').value.trim();
    const status = document.getElementById('status-filter').value;
    const grid = document.getElementById('projects-grid');
    grid.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    try {
      let url = `/projects?page=${page}&limit=${limit}`;
      if (search) url += '&search=' + encodeURIComponent(search);
      if (status) url += '&status=' + status;
      const data = await API.get(url);
      const projects = data.projects || data || [];
      total = data.total || projects.length;
      renderProjects(projects);
      renderPagination();
    } catch (err) {
      grid.innerHTML = `<div class="alert alert-error">Failed to load projects: ${err.message}</div>`;
    }
  }

  function renderProjects(projects) {
    const grid = document.getElementById('projects-grid');
    if (!projects.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="empty-icon">🗺</div><div class="empty-title">NO PROJECTS FOUND</div><div class="empty-desc">Try adjusting your search or filters.</div></div>`;
      return;
    }
    grid.innerHTML = projects.map(p => `
      <a href="/project.html?id=${p._id}" class="project-card">
        <div class="pc-top">
          <div class="pc-name">${p.name || 'Untitled'}</div>
          <span class="status ${statusClass(p.status || 'active')}">${p.status || 'active'}</span>
        </div>
        <div class="pc-desc">${(p.description||'No description.').substring(0,120)}…</div>
        <div class="pc-footer">
          <div class="pc-roles">
            ${(p.roles||[]).slice(0,3).map(r=>`<span class="pc-role">${typeof r==='object'?r.name||r:r}</span>`).join('')}
          </div>
          <span class="pc-meta">👥 ${p.memberCount||0} / ${p.maxMembers||'∞'}</span>
        </div>
      </a>`).join('');
  }

  function renderPagination() {
    const pages = Math.ceil(total / limit);
    if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="changePage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= pages; i++) {
      html += `<button class="page-btn ${i===page?'active':''}" onclick="changePage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" onclick="changePage(${page+1})" ${page===pages?'disabled':''}>›</button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  function changePage(n) { page = n; loadProjects(); window.scrollTo(0,0); }

  let debounceTimer;
  document.getElementById('search').addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { page = 1; loadProjects(); }, 350);
  });
  document.getElementById('status-filter').addEventListener('change', () => { page=1; loadProjects(); });

  // Create project form
  document.getElementById('create-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('create-submit');
    const alertEl = document.getElementById('create-alert');
    btn.disabled = true; btn.textContent = 'CREATING…';
    alertEl.innerHTML = '';
    try {
      const roles = document.getElementById('p-roles').value.split(',').map(r=>r.trim()).filter(Boolean);
      const tech  = document.getElementById('p-tech').value.split(',').map(t=>t.trim()).filter(Boolean);
      await API.post('/projects', {
        name: document.getElementById('p-name').value.trim(),
        description: document.getElementById('p-desc').value.trim(),
        techStack: tech,
        roles: roles.map(name => ({ name, slots: 2 })),
        maxMembers: parseInt(document.getElementById('p-max').value) || 10,
      });
      Toast.success('Project created!');
      closeModal('create-modal');
      document.getElementById('create-form').reset();
      loadProjects();
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'CREATE PROJECT';
    }
  });

  loadProjects();
}
</script>
</body>
</html>
