<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Register — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before { content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.025)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.025)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0; }
    body { display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px; }
    .glow-orb { position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(ellipse,rgba(155,109,255,0.04)0%,transparent 65%);pointer-events:none;z-index:0; }
    .pw-strength { height:3px;background:var(--border);margin-top:6px;overflow:hidden; }
    .pw-strength-bar { height:100%;width:0;transition:width 0.3s,background 0.3s; }
  </style>
</head>
<body class="grid-bg">
<div class="glow-orb"></div>
<div class="portal">
  <div class="portal-box">
    <div class="portal-logo">
      <div class="portal-logo-hex">XP</div>
      <span class="portal-brand">JOB<b>XP</b></span>
    </div>
    <h1 class="portal-title">CREATE HERO</h1>
    <p class="portal-sub">Join the arena and start earning XP</p>

    <div id="alert-area"></div>

    <form id="reg-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="hero@jobxp.io" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min 8 characters" required minlength="8"/>
        <div class="pw-strength"><div class="pw-strength-bar" id="pw-bar"></div></div>
        <div class="form-hint" id="pw-hint">Use letters, numbers & symbols</div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirm" class="form-input" placeholder="Repeat password" required/>
        <div class="form-error" id="match-err">Passwords do not match</div>
      </div>
      <button type="submit" class="btn btn-cyan btn-lg" id="submit-btn" style="width:100%;justify-content:center;">
        ⚡ CREATE ACCOUNT
      </button>
    </form>

    <div class="portal-footer">
      Already a hero? <a href="/login.html">Login →</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  Auth.redirectIfLoggedIn();

  const form  = document.getElementById('reg-form');
  const btn   = document.getElementById('submit-btn');
  const alert = document.getElementById('alert-area');
  const pwInput = document.getElementById('password');
  const pwBar   = document.getElementById('pw-bar');
  const pwHint  = document.getElementById('pw-hint');
  const matchErr= document.getElementById('match-err');

  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let s = 0;
    if (v.length>=8) s++;
    if (/[A-Z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    const pcts=['0%','30%','55%','80%','100%'];
    const cols =['','var(--red)','var(--orange)','var(--gold)','var(--green)'];
    const lbls =['','Weak','Fair','Good','Strong'];
    pwBar.style.width = pcts[s]; pwBar.style.background = cols[s];
    pwHint.textContent = lbls[s] || 'Use letters, numbers & symbols';
    pwHint.style.color = cols[s] || 'var(--text-3)';
  });

  function showAlert(msg, type = 'error') {
    alert.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    matchErr.classList.remove('show');
    const pw = document.getElementById('password').value;
    const cf = document.getElementById('confirm').value;
    if (pw !== cf) { matchErr.classList.add('show'); return; }

    btn.disabled = true;
    btn.textContent = 'CREATING…';
    alert.innerHTML = '';
    try {
      await API.post('/auth/signup', {
        email: document.getElementById('email').value.trim(),
        password: pw,
      });
      window.location.href = '/verify.html?email=' + encodeURIComponent(document.getElementById('email').value.trim());
    } catch (err) {
      showAlert(err.message || 'Registration failed. Try again.');
      btn.disabled = false;
      btn.textContent = '⚡ CREATE ACCOUNT';
    }
  });
</script>
</body>
</html>
