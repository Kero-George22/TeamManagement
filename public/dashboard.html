<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboard — JobXP</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <style>
    body::before { content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.02)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.02)1px,transparent 1px);background-size:72px 72px;pointer-events:none;z-index:0; }
    .dash-hero {
      background:var(--bg-card); border:1px solid var(--border);
      padding:32px 36px; margin-bottom:28px;
      display:flex; align-items:center; gap:32px; flex-wrap:wrap;
      position:relative; overflow:hidden;
      animation:fade-up 0.4s ease;
    }
    .dash-hero::after { content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--gold)); }
    .dh-avatar {
      width:80px;height:80px;flex-shrink:0;
      clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      background:var(--cyan-dim);border:2px solid var(--border-hi);
      display:flex;align-items:center;justify-content:center;font-size:36px;
    }
    .dh-info { flex:1; }
    .dh-greeting { font-family:var(--font-mono); font-size:11px; letter-spacing:3px; color:var(--text-2); margin-bottom:6px; }
    .dh-name { font-family:var(--font-display); font-size:clamp(18px,3vw,28px); font-weight:900; letter-spacing:4px; margin-bottom:12px; }
    .dh-name span { color:var(--cyan); }
    .dh-xp-wrap { max-width:380px; }
    .dh-right { text-align:right; }
    .dh-lvl-big { font-family:var(--font-display); font-size:52px; font-weight:900; line-height:1; color:var(--cyan); text-shadow:var(--cyan-glow); }
    .dh-lvl-lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:3px; color:var(--text-2); }
    .dh-badges-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

    .section-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .section-hd-title { font-family:var(--font-display); font-size:12px; font-weight:700; letter-spacing:3px; color:var(--text-1); }

    .recent-tasks-list { display:flex; flex-direction:column; gap:10px; }
    .quick-action-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
    .quick-action {
      background:var(--bg-card); border:1px solid var(--border);
      padding:22px 18px; text-align:center; cursor:pointer;
      transition:transform 0.3s,border-color 0.3s,box-shadow 0.3s;
      display:block; text-decoration:none;
    }
    .quick-action:hover { transform:translateY(-4px); border-color:var(--border-hi); box-shadow:0 10px 30px rgba(0,0,0,0.3); }
    .qa-icon { font-size:32px; margin-bottom:12px; display:block; }
    .qa-label { font-family:var(--font-display); font-size:10px; font-weight:700; letter-spacing:2px; color:var(--text-2); }
    .quick-action:hover .qa-label { color:var(--cyan); }

    .skills-overview { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
    .skill-item {
      background:var(--bg-card); border:1px solid var(--border); padding:18px 16px;
    }
    .si-name { font-family:var(--font-display); font-size:10px; font-weight:700; letter-spacing:2px; color:var(--cyan); margin-bottom:6px; }
    .si-level { font-size:12px; color:var(--text-2); margin-bottom:10px; }
    .notif-list { display:flex; flex-direction:column; gap:8px; }
    .notif-item {
      display:flex; align-items:flex-start; gap:12px;
      padding:12px 14px; background:var(--bg-2); border:1px solid var(--border);
    }
    .notif-icon { font-size:18px; flex-shrink:0; margin-top:1px; }
    .notif-text { font-size:13px; line-height:1.5; }
    .notif-time { font-family:var(--font-mono); font-size:10px; color:var(--text-3); margin-top:3px; }
  </style>
</head>
<body class="grid-bg">

<!-- Nav injected by JS -->

<div class="app-layout">
  <main class="app-main" id="main" style="display:none;">

    <!-- Hero banner -->
    <div class="dash-hero" id="dash-hero">
      <div class="dh-avatar" id="dh-avatar">👤</div>
      <div class="dh-info">
        <div class="dh-greeting" id="dh-greeting">PLAYER PROFILE</div>
        <div class="dh-name" id="dh-name">LOADING…</div>
        <div class="dh-xp-wrap">
          <div class="xp-bar-row">
            <span class="xp-bar-lbl">XP PROGRESS</span>
            <span class="xp-bar-val" id="dh-xp-val">0 XP</span>
          </div>
          <div class="xp-track"><div class="xp-fill" id="dh-xp-bar" style="--w:0%"></div></div>
        </div>
        <div class="dh-badges-row" id="dh-badges"></div>
      </div>
      <div class="dh-right">
        <div class="dh-lvl-big" id="dh-level">1</div>
        <div class="dh-lvl-lbl">LEVEL</div>
      </div>
    </div>

    <!-- Stat row -->
    <div class="grid-4 mb-6" id="stats-row">
      <div class="stat-card">
        <span class="sc-icon">⚔️</span>
        <div class="sc-val" id="s-tasks">—</div>
        <div class="sc-lbl">Tasks Done</div>
      </div>
      <div class="stat-card gld">
        <span class="sc-icon">⭐</span>
        <div class="sc-val" id="s-xp">—</div>
        <div class="sc-lbl">Total XP</div>
      </div>
      <div class="stat-card ppl">
        <span class="sc-icon">🏆</span>
        <div class="sc-val" id="s-rank">—</div>
        <div class="sc-lbl">Global Rank</div>
      </div>
      <div class="stat-card grn">
        <span class="sc-icon">📋</span>
        <div class="sc-val" id="s-rel">—</div>
        <div class="sc-lbl">Reliability</div>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="card mb-6">
      <div class="card-header">
        <span class="card-title">Quick Actions</span>
      </div>
      <div class="quick-action-grid">
        <a href="/projects.html" class="quick-action"><span class="qa-icon">🗺</span><span class="qa-label">Browse Projects</span></a>
        <a href="/assessment.html" class="quick-action"><span class="qa-icon">🎯</span><span class="qa-label">Take Assessment</span></a>
        <a href="/leaderboard.html" class="quick-action"><span class="qa-icon">🏆</span><span class="qa-label">Leaderboard</span></a>
        <a href="/portfolio.html" class="quick-action"><span class="qa-icon">📋</span><span class="qa-label">My Portfolio</span></a>
        <a href="/profile.html" class="quick-action"><span class="qa-icon">⚙️</span><span class="qa-label">Edit Profile</span></a>
      </div>
    </div>

    <!-- Skills + Recent tasks -->
    <div class="grid-2 mb-6">
      <!-- Skills -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Skill Tree</span>
          <a href="/assessment.html" class="btn btn-sm btn-outline">Take Test</a>
        </div>
        <div class="skills-overview" id="skills-overview">
          <div class="loader"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Recent tasks -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Recent Tasks</span>
          <a href="/projects.html" class="btn btn-sm btn-outline">All Projects</a>
        </div>
        <div class="recent-tasks-list" id="recent-tasks">
          <div class="loader"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- Active projects -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">My Active Projects</span>
        <a href="/projects.html" class="btn btn-sm btn-cyan">Browse All</a>
      </div>
      <div class="grid-auto" id="active-projects">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>

  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
if (!Auth.require()) {}
else {
  injectNav('Dashboard');

  const user = Auth.user();

  async function load() {
    document.getElementById('main').style.display = '';

    // Hero
    const av = document.getElementById('dh-avatar');
    av.textContent = user.avatar || '👤';
    document.getElementById('dh-greeting').textContent = 'WELCOME BACK, PLAYER';
    document.getElementById('dh-name').innerHTML = (user.username || user.email?.split('@')[0] || 'HERO').toUpperCase().replace(/(.+)/, '<span>$1</span>');
    document.getElementById('dh-level').textContent = user.level || 1;
    const xpInLevel = (user.totalXP || 0) % 1000;
    document.getElementById('dh-xp-val').textContent = (user.totalXP || 0).toLocaleString() + ' XP';
    const bar = document.getElementById('dh-xp-bar');
    bar.style.setProperty('--w', Math.round(xpInLevel/10) + '%');

    // Badges
    const badgesEl = document.getElementById('dh-badges');
    if (user.badges && user.badges.length) {
      badgesEl.innerHTML = user.badges.slice(0,5).map(b => `<span class="badge-chip gold">🏅 ${b}</span>`).join('');
    }

    // Stats
    document.getElementById('s-tasks').textContent = user.completedTasks || 0;
    document.getElementById('s-xp').textContent = (user.totalXP || 0).toLocaleString();

    // Load rank + full profile
    try {
      const [profileData, statsData] = await Promise.all([
        API.get('/profile/me'),
        API.get('/profile/me/stats'),
      ]);
      const u = profileData.user || profileData;

      // Update stored user
      localStorage.setItem('jxp_user', JSON.stringify({ ...user, ...u }));

      document.getElementById('s-rel').textContent = (u.reliabilityScore || 0) + '%';

      // Rank
      try {
        const rankData = await API.get('/profile/' + u._id + '/rank');
        document.getElementById('s-rank').textContent = '#' + (rankData.rank || '—');
      } catch { document.getElementById('s-rank').textContent = '—'; }

      // Skills
      renderSkills(u.skills || {});

      // Stats data
      if (statsData) {
        document.getElementById('s-tasks').textContent = statsData.completedTasks || u.completedTasks || 0;
      }
    } catch (err) {
      console.error(err);
    }

    // Projects
    loadProjects();
  }

  function renderSkills(skills) {
    const areas = ['Frontend','Backend','FullStack','DevOps','DataScience'];
    const icons = { Frontend:'⚡', Backend:'🔧', FullStack:'🌐', DevOps:'🚀', DataScience:'🧠' };
    const pcts  = { null:0, 'Beginner':25, 'Intermediate':50, 'Advanced':75, 'Expert':100 };
    const el = document.getElementById('skills-overview');
    el.innerHTML = areas.map(a => {
      const s = skills[a] || {};
      const lvl = s.level || null;
      const pct = pcts[lvl] || 0;
      return `
        <div class="skill-item">
          <div class="si-name">${icons[a]} ${a}</div>
          <div class="si-level">${lvl || 'Not Assessed'}</div>
          <div class="xp-track"><div class="xp-fill" style="--w:${pct}%;animation:xp-in 1.2s ease both;"></div></div>
        </div>`;
    }).join('');
  }

  async function loadProjects() {
    try {
      const data = await API.get('/projects?limit=6');
      const projects = data.projects || data || [];
      const el = document.getElementById('active-projects');
      if (!projects.length) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">🗺</div><div class="empty-title">NO PROJECTS YET</div><div class="empty-desc">Browse and join an active project to start earning XP.</div><a href="/projects.html" class="btn btn-cyan mt-3">Browse Projects</a></div>`;
        return;
      }
      el.innerHTML = projects.slice(0,6).map(p => `
        <a href="/project.html?id=${p._id}" class="project-card">
          <div class="pc-top">
            <div class="pc-name">${p.name || 'Unnamed Project'}</div>
            <span class="status ${statusClass(p.status)}">${p.status || 'active'}</span>
          </div>
          <div class="pc-desc">${(p.description||'').substring(0,100)}${(p.description||'').length>100?'…':''}</div>
          <div class="pc-footer">
            <div class="pc-roles">${(p.roles||[]).slice(0,3).map(r=>`<span class="pc-role">${typeof r==='object'?r.name||r:r}</span>`).join('')}</div>
            <span class="pc-meta">${p.memberCount||0} members</span>
          </div>
        </a>`).join('');

      // Recent tasks from first project
      if (projects[0]) loadRecentTasks(projects[0]._id);
      else document.getElementById('recent-tasks').innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">NO TASKS YET</div></div>`;
    } catch {
      document.getElementById('active-projects').innerHTML = `<div class="alert alert-error">Failed to load projects.</div>`;
    }
  }

  async function loadRecentTasks(projectId) {
    try {
      const data = await API.get('/tasks/' + projectId);
      const tasks = (data.tasks || data || []).slice(0, 4);
      const el = document.getElementById('recent-tasks');
      if (!tasks.length) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">NO TASKS</div></div>`;
        return;
      }
      el.innerHTML = tasks.map(t => `
        <div class="task-card ${statusClass(t.status)}" onclick="location.href='/task.html?id=${t._id}'">
          <div class="tc-header">
            <div class="tc-title">${t.title||'Untitled Task'}</div>
            <span class="tc-priority ${priorityClass(t.priority)}">${t.priority||'Low'}</span>
          </div>
          <div class="tc-footer">
            <span class="tc-xp">+${t.xpReward||0} XP</span>
            <span class="status ${statusClass(t.status)}">${t.status||'Todo'}</span>
          </div>
        </div>`).join('');
    } catch {
      document.getElementById('recent-tasks').innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">NO TASKS</div></div>`;
    }
  }

  load();
}
</script>
</body>
</html>
